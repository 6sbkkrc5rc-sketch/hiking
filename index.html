<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0,user-scalable=no">
<title>台灣登山助手</title>
<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: #f2f6f3;
    color: #1e2a25;
}
header {
    background: linear-gradient(135deg,#1f6b4f,#3c9b70);
    color: white;
    padding: 24px 20px 20px;
    border-radius: 0 0 28px 28px;
    box-shadow: 0 5px 18px rgba(0,0,0,.15);
}
.header-title { font-size: 28px; font-weight: 800; }
.header-sub { margin-top: 5px; opacity: .9; font-size: 14px; }
.container { padding: 16px; max-width: 650px; margin: auto; }
.card {
    background: white; border-radius: 20px; padding: 17px;
    margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,.07);
}
.card-title { font-size: 18px; font-weight: 800; margin-bottom: 13px; }
.big-button {
    width: 100%; border: none; border-radius: 18px; padding: 18px;
    font-size: 20px; font-weight: 800; color: white;
    background: #168653; box-shadow: 0 5px 12px rgba(22,134,83,.3);
}
.big-button:active { transform: scale(.98); }
.stop-button { background: #d93636; }
.small-button {
    border: none; background: #e8f2ed; color: #17623f;
    border-radius: 12px; padding: 11px 14px; font-weight: 700;
    margin-right: 6px; margin-top: 6px;
}
.grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; }
.info { background: #f4f8f6; border-radius: 14px; padding: 13px; }
.info-label { color: #718078; font-size: 12px; }
.info-value { font-size: 20px; font-weight: 800; margin-top: 4px; }
#map { height: 380px; border-radius: 18px; overflow: hidden; }
.status {
    text-align: center; padding: 10px; border-radius: 12px;
    margin-bottom: 12px; background: #edf7f1; color: #17623f;
    font-weight: 700;
}
.warning { background: #fff1d6; color: #9a5a00; }
.danger { background: #ffe4e4; color: #b32626; }
.hidden { display: none !important; }
input {
    width: 100%; padding: 13px; border: 1px solid #d5ddd8;
    border-radius: 12px; font-size: 16px; margin-bottom: 10px;
}
.record {
    border: 1px solid #e2e9e5; border-radius: 15px;
    padding: 14px; margin-bottom: 10px;
}
.record-title { font-size: 18px; font-weight: 800; }
.record-detail { font-size: 13px; color: #65736c; line-height: 1.7; margin-top: 6px; }
.record-buttons { display: flex; gap: 7px; margin-top: 10px; flex-wrap: wrap; }
.weather-main { font-size: 22px; font-weight: 800; }
.weather-detail { color: #68756f; margin-top: 5px; }
.footer { text-align: center; color: #87918c; font-size: 12px; padding: 20px; }
</style>
</head>
<body>
<header>
    <div class="header-title">🏔️ 台灣登山助手</div>
    <div class="header-sub">記錄每一步，安全走完每一座山</div>
</header>
<div class="container">
<div id="statusBox" class="status">📍 尚未開始登山</div>

<div class="card">
    <div class="card-title">🗺️ 登山地圖</div>
    <div id="map"></div>
</div>

<div class="card">
    <div class="card-title">📊 即時登山資料</div>
    <div class="grid">
        <div class="info"><div class="info-label">行走時間</div><div class="info-value" id="time">00:00:00</div></div>
        <div class="info"><div class="info-label">行走距離</div><div class="info-value" id="distance">0.00 km</div></div>
        <div class="info"><div class="info-label">目前高度</div><div class="info-value" id="altitude">-- m</div></div>
        <div class="info"><div class="info-label">目前速度</div><div class="info-value" id="speed">-- km/h</div></div>
        <div class="info"><div class="info-label">緯度</div><div class="info-value" id="lat">--</div></div>
        <div class="info"><div class="info-label">經度</div><div class="info-value" id="lng">--</div></div>
    </div>
</div>

<div class="card">
    <button id="startBtn" class="big-button" onclick="startHiking()">🥾 開始登山</button>
    <button id="stopBtn" class="big-button stop-button hidden" onclick="stopHiking()">🛑 結束登山</button>
</div>

<div class="card">
    <div class="card-title">🌦️ 目前天氣</div>
    <div id="weather">尚未取得定位</div>
    <button class="small-button" onclick="getWeather()">🔄 更新天氣</button>
</div>

<div class="card">
    <div class="card-title">🆘 登山安全聯絡人</div>
    <input id="familyName" type="text" placeholder="家人姓名">
    <input id="familyEmail" type="email" placeholder="家人 Email">
    <button class="small-button" onclick="saveFamily()">💾 儲存聯絡人</button>
    <div id="familyStatus" style="margin-top:10px;color:#68756f;"></div>
</div>

<div class="card">
    <div class="card-title">📚 我的登山紀錄</div>
    <div id="records">尚無登山紀錄</div>
</div>
</div>
<div class="footer">台灣登山助手 · Mountain Safety</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let map, marker, routeLine;
let watchID = null;
let hiking = false;
let startTime = null, endTime = null;
let timerID = null;
let positions = [];
let totalDistance = 0;
let lastPosition = null;
let lastMovementTime = null;
let inactivityTimer = null;
let weatherTimer = null;
let locating = false;
let mapCentered = false;

/* 安全儲存 / 讀取 */
function safeGetRecords() {
    try {
        return JSON.parse(localStorage.getItem("hikingRecords") || "[]");
    } catch (e) {
        console.warn("讀取紀錄失敗：", e);
        return [];
    }
}
function safeSaveRecords(records) {
    try {
        localStorage.setItem("hikingRecords", JSON.stringify(records));
        console.log("✅ 已寫入 localStorage，共 " + records.length + " 筆");
        return true;
    } catch (e) {
        console.error("❌ 寫入失敗：", e);
        alert("儲存失敗：" + e.message);
        return false;
    }
}

/* 初始化地圖 */
function initMap() {
    map = L.map("map", {
        zoomControl: true,
        attributionControl: true
    }).setView([23.6978, 120.9605], 8);

    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        { maxZoom: 19, attribution: "&copy; OpenStreetMap contributors" }
    ).addTo(map);

    routeLine = L.polyline([], { weight: 5 }).addTo(map);

    setTimeout(function () {
        map.invalidateSize();
        locateUser();
    }, 300);
}

/* 單次定位 */
function locateUser() {
    if (!navigator.geolocation) {
        showStatus("❌ 此裝置不支援 GPS 定位", "danger");
        return;
    }
    if (locating) return;
    locating = true;
    showStatus("📍 正在取得目前位置...", "warning");

    navigator.geolocation.getCurrentPosition(
        function (position) {
            locating = false;
            updatePosition(position);
            showStatus("📍 已取得目前位置", "");
            getWeather();          // ← 自動抓天氣
        },
        function (error) {
            locating = false;
            let message = "";
            switch (error.code) {
                case 1: message = "❌ 定位權限被拒絕。請到設定開啟定位權限。"; break;
                case 2: message = "❌ 找不到位置。請確認定位服務已開啟。"; break;
                case 3: message = "❌ 定位逾時。請到空曠處或窗邊再試。"; break;
                default: message = "❌ GPS 定位發生錯誤。";
            }
            showStatus(message, "danger");
        },
        { enableHighAccuracy: true, timeout: 20000, maximumAge: 60000 }
    );
}

/* 開始登山 */
function startHiking() {
    if (!navigator.geolocation) { alert("手機不支援 GPS"); return; }
    hiking = true;
    startTime = new Date();
    positions = [];
    totalDistance = 0;
    lastMovementTime = Date.now();
    routeLine.setLatLngs([]);
    document.getElementById("startBtn").classList.add("hidden");
    document.getElementById("stopBtn").classList.remove("hidden");
    document.getElementById("distance").textContent = "0.00 km";
    document.getElementById("time").textContent = "00:00:00";
    showStatus("🥾 登山紀錄進行中", "");

    timerID = setInterval(updateTimer, 1000);
    watchID = navigator.geolocation.watchPosition(
        updatePosition, gpsError,
        { enableHighAccuracy: true, maximumAge: 10000, timeout: 30000 }
    );

    startInactivityCheck();
    startWeatherAutoUpdate();   // ← 啟動天氣自動更新
}

/* GPS 更新 */
function updatePosition(position) {
    const lat = position.coords.latitude;
    const lng = position.coords.longitude;
    const altitude = position.coords.altitude;
    const speed = position.coords.speed;
    const current = {
        lat: lat, lng: lng,
        altitude: altitude,
        time: new Date().toISOString()
    };
    lastPosition = current;

    document.getElementById("lat").textContent = lat.toFixed(6);
    document.getElementById("lng").textContent = lng.toFixed(6);
    document.getElementById("altitude").textContent =
        altitude !== null ? altitude.toFixed(0) + " m" : "-- m";
    document.getElementById("speed").textContent =
        speed !== null ? (speed * 3.6).toFixed(1) + " km/h" : "-- km/h";

    if (!marker) {
        marker = L.marker([lat, lng]).addTo(map);
        map.setView([lat, lng], hiking ? 17 : 15);
        mapCentered = true;
    } else {
        marker.setLatLng([lat, lng]);
        if (!mapCentered) {
            map.setView([lat, lng], hiking ? 17 : 15);
            mapCentered = true;
        }
    }

    if (hiking) {
        if (positions.length > 0) {
            const previous = positions[positions.length - 1];
            const distance = calculateDistance(
                previous.lat, previous.lng, lat, lng
            );
            if (distance > 0.005 && distance < 1) {
                totalDistance += distance;
                document.getElementById("distance").textContent =
                    totalDistance.toFixed(2) + " km";
                lastMovementTime = Date.now();
            }
        }
        positions.push(current);
        routeLine.setLatLngs(positions.map(p => [p.lat, p.lng]));
    }
}

function calculateDistance(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2)*Math.sin(dLat/2) +
              Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180) *
              Math.sin(dLon/2)*Math.sin(dLon/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c;
}

function updateTimer() {
    if (!startTime) return;
    const seconds = Math.floor((Date.now() - startTime.getTime()) / 1000);
    document.getElementById("time").textContent = formatTime(seconds);
}
function formatTime(seconds) {
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    const s = seconds % 60;
    return String(h).padStart(2,"0") + ":" +
           String(m).padStart(2,"0") + ":" +
           String(s).padStart(2,"0");
}

/* 結束登山 */
function stopHiking() {
    if (!hiking) return;
    hiking = false;
    endTime = new Date();

    if (watchID !== null) {
        navigator.geolocation.clearWatch(watchID);
        watchID = null;
    }
    clearInterval(timerID);
    clearInterval(inactivityTimer);
    stopWeatherAutoUpdate();   // ← 停止天氣自動更新

    document.getElementById("startBtn").classList.remove("hidden");
    document.getElementById("stopBtn").classList.add("hidden");
    showStatus("✅ 登山完成，正在儲存...", "");

    const defaultName = "我的登山 " + new Date().toLocaleDateString();
    const inputName = window.prompt("請輸入這次登山名稱", defaultName);
    const name = (inputName && inputName.trim())
        ? inputName.trim()
        : defaultName;

    const record = {
        id: Date.now(),
        name: name,
        date: startTime.toLocaleString(),
        startTime: startTime.toISOString(),
        endTime: endTime.toISOString(),
        duration: endTime.getTime() - startTime.getTime(),
        distance: totalDistance,
        positions: positions,
        startPosition: positions.length ? positions[0] : null,
        endPosition: positions.length ? positions[positions.length-1] : null
    };

    const records = safeGetRecords();
    records.unshift(record);
    const ok = safeSaveRecords(records);

    showStatus(
        ok ? "✅ 紀錄已儲存（共 " + records.length + " 筆）"
           : "⚠️ 儲存失敗，請看 Console",
        ok ? "" : "warning"
    );
    loadRecords();
}

/* 紀錄列表 */
function loadRecords() {
    const records = safeGetRecords();
    const container = document.getElementById("records");
    if (records.length === 0) {
        container.innerHTML = "尚無登山紀錄";
        return;
    }
    container.innerHTML = "";
    records.forEach(function (record) {
        const div = document.createElement("div");
        div.className = "record";
        const duration = formatTime(Math.floor(record.duration / 1000));
        const start = record.startPosition;
        const end = record.endPosition;
        div.innerHTML = `
            <div class="record-title">🏔️ ${escapeHTML(record.name)}</div>
            <div class="record-detail">
                📅 ${record.date}<br>
                📏 ${record.distance.toFixed(2)} km<br>
                ⏱️ ${duration}<br>
                📍 起點：${start ? start.lat.toFixed(6) + ", " + start.lng.toFixed(6) : "--"}<br>
                📍 終點：${end ? end.lat.toFixed(6) + ", " + end.lng.toFixed(6) : "--"}
            </div>
            <div class="record-buttons">
                <button class="small-button" onclick="renameRecord(${record.id})">✏️ 改名稱</button>
                <button class="small-button" onclick="showRecord(${record.id})">🗺️ 查看路線</button>
                <button class="small-button" onclick="repeatRecord(${record.id})">🔁 再走一次</button>
                <button class="small-button" onclick="deleteRecord(${record.id})">🗑️ 刪除</button>
            </div>
        `;
        container.appendChild(div);
    });
}

function escapeHTML(text) {
    return String(text)
        .replace(/&/g,"&amp;").replace(/</g,"&lt;")
        .replace(/>/g,"&gt;").replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function renameRecord(id) {
    const records = safeGetRecords();
    const record = records.find(r => r.id === id);
    if (!record) return;
    const name = prompt("請輸入新的名稱", record.name);
    if (!name) return;
    record.name = name;
    safeSaveRecords(records);
    loadRecords();
}
function showRecord(id) {
    const records = safeGetRecords();
    const record = records.find(r => r.id === id);
    if (!record || !record.positions.length) return;
    routeLine.setLatLngs(record.positions.map(p => [p.lat, p.lng]));
    map.fitBounds(routeLine.getBounds(), { padding: [30,30] });
    mapCentered = true;
}
function repeatRecord(id) {
    const records = safeGetRecords();
    const record = records.find(r => r.id === id);
    if (!record) return;
    if (!confirm("要開始重新走這條路線嗎？\n\n原本的紀錄不會被刪除。")) return;
    routeLine.setLatLngs(record.positions.map(p => [p.lat, p.lng]));
    map.fitBounds(routeLine.getBounds(), { padding: [30,30] });
    mapCentered = true;
    alert("已載入原本的路線。\n\n現在按「開始登山」即可建立新的紀錄。");
}
function deleteRecord(id) {
    if (!confirm("確定要刪除這筆登山紀錄嗎？")) return;
    let records = safeGetRecords();
    records = records.filter(r => r.id !== id);
    safeSaveRecords(records);
    loadRecords();
}

/* 天氣自動更新 */
function startWeatherAutoUpdate() {
    if (weatherTimer) return;
    getWeather();                          // 立即抓一次
    weatherTimer = setInterval(getWeather, 10 * 60 * 1000); // 每 10 分鐘
}
function stopWeatherAutoUpdate() {
    if (weatherTimer) {
        clearInterval(weatherTimer);
        weatherTimer = null;
    }
}

/* 天氣 */
async function getWeather() {
    if (!lastPosition) {
        navigator.geolocation.getCurrentPosition(
            p => { updatePosition(p); getWeather(); },
            error => {
                document.getElementById("weather").innerHTML =
                    "⚠️ 請先允許 GPS 定位";
            },
            { enableHighAccuracy: true, timeout: 20000, maximumAge: 60000 }
        );
        return;
    }
    const lat = lastPosition.lat;
    const lng = lastPosition.lng;
    document.getElementById("weather").innerHTML = "🌦️ 正在取得天氣...";
    try {
        const url =
            "https://api.open-meteo.com/v1/forecast" +
            "?latitude=" + lat +
            "&longitude=" + lng +
            "&current=temperature_2m," +
            "relative_humidity_2m," +
            "precipitation," +
            "weather_code," +
            "wind_speed_10m" +
            "&timezone=Asia%2FTaipei";
        const response = await fetch(url);
        const data = await response.json();
        const current = data.current;
        const code = current.weather_code;
        const description = weatherDescription(code);
        let warning = "";
        if (current.precipitation > 2)
            warning = "⚠️ 目前降雨較明顯，登山請注意安全。";
        if (current.wind_speed_10m > 40)
            warning = "⚠️ 目前風速較強，不建議冒險登山。";
        if (code >= 95)
            warning = "🆘 偵測到雷雨天氣，建議立即停止登山。";

        document.getElementById("weather").innerHTML = `
            <div class="weather-main">${description}</div>
            <div class="weather-detail">
                🌡️ ${current.temperature_2m} °C<br>
                💧 ${current.relative_humidity_2m} %<br>
                🌧️ ${current.precipitation} mm<br>
                💨 ${current.wind_speed_10m} km/h
                <br>
                <span style="font-size:12px;color:#9aa5a0;">
                    更新：${new Date().toLocaleTimeString()}
                </span>
            </div>
            ${
                warning
                ? `<div class="status warning" style="margin-top:10px">${warning}</div>`
                : `<div class="status" style="margin-top:10px">✅ 目前沒有偵測到明顯天氣危險</div>`
            }
        `;
    } catch (error) {
        console.error("天氣取得失敗：", error);
        document.getElementById("weather").innerHTML =
            "❌ 天氣資料取得失敗";
    }
}

function weatherDescription(code) {
    if (code === 0) return "☀️ 晴朗";
    if (code <= 3) return "🌤️ 晴時多雲";
    if (code <= 48) return "🌫️ 有霧";
    if (code <= 67) return "🌧️ 下雨";
    if (code <= 77) return "❄️ 降雪";
    if (code <= 82) return "🌧️ 陣雨";
    if (code >= 95) return "⛈️ 雷雨";
    return "🌦️ 不穩定天氣";
}

/* 兩小時未移動 */
function startInactivityCheck() {
    inactivityTimer = setInterval(checkInactivity, 60000);
}
function checkInactivity() {
    if (!hiking) return;
    const inactive = Date.now() - lastMovementTime;
    if (inactive >= 2 * 60 * 60 * 1000) {
        clearInterval(inactivityTimer);
        alert(
            "🆘 安全提醒\n\n" +
            "已經超過 2 小時沒有偵測到明顯移動。\n\n" +
            "請確認你目前是否安全。"
        );
        sendSafetyEmail();
    }
}

function sendSafetyEmail() {
    const email = localStorage.getItem("familyEmail");
    if (!email) { alert("尚未設定家人 Email。"); return; }
    const lat = lastPosition ? lastPosition.lat.toFixed(6) : "--";
    const lng = lastPosition ? lastPosition.lng.toFixed(6) : "--";
    const altitude = (lastPosition && lastPosition.altitude !== null)
        ? lastPosition.altitude.toFixed(0) : "--";
    const subject = "🆘 登山安全通知";
    const body =
        "登山安全通知%0D%0A%0D%0A" +
        "目前可能已超過 2 小時沒有移動。%0D%0A%0D%0A" +
        "最後位置：%0D%0A" +
        "緯度：" + lat + "%0D%0A" +
        "經度：" + lng + "%0D%0A" +
        "高度：" + altitude + " m%0D%0A" +
        "時間：" + new Date().toLocaleString();
    window.location.href =
        "mailto:" + email +
        "?subject=" + encodeURIComponent(subject) +
        "&body=" + body;
}

function saveFamily() {
    const name = document.getElementById("familyName").value.trim();
    const email = document.getElementById("familyEmail").value.trim();
    if (!email) { alert("請輸入家人 Email"); return; }
    localStorage.setItem("familyName", name);
    localStorage.setItem("familyEmail", email);
    document.getElementById("familyStatus").textContent =
        "✅ 已保存安全聯絡人：" + (name || email);
}

function gpsError(error) {
    let message = "";
    switch (error.code) {
        case 1: message = "⚠️ GPS 權限被拒絕。"; break;
        case 2: message = "⚠️ 無法取得位置。"; break;
        case 3: message = "⚠️ 定位逾時。請到空曠處再試。"; break;
        default: message = "⚠️ GPS 定位失敗。";
    }
    showStatus(message, "warning");
}

function showStatus(message, type) {
    const box = document.getElementById("statusBox");
    box.textContent = message;
    box.className = "status";
    if (type) box.classList.add(type);
}

window.onload = function () {
    initMap();
    loadRecords();
    const savedName = localStorage.getItem("familyName");
    const savedEmail = localStorage.getItem("familyEmail");
    if (savedName) document.getElementById("familyName").value = savedName;
    if (savedEmail) document.getElementById("familyEmail").value = savedEmail;
    if (savedEmail) {
        document.getElementById("familyStatus").textContent =
            "✅ 已設定安全聯絡人：" + (savedName || savedEmail);
    }
};
</script>
</body>
</html>
